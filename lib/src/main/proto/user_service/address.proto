syntax = "proto3";

import "google/protobuf/timestamp.proto";

package tbd.user_service;

option java_multiple_files = true;
option java_package = "com.tbd.proto.user_service";
option java_outer_classname = "TbdAddressProtos";

message TbdAddressProto {

  int64 id = 1;
  string address_line_1 = 2;
  string address_line_2 = 3;
  string city = 4;
  string state = 5;
  string country = 6;
  string zip_code = 7;
  string country_code = 8;
  string phone_number = 9;
  string alternate_phone_number = 10;
  string full_name = 11;
  string landmark = 12;

  google.protobuf.Timestamp created_date = 13;
  google.protobuf.Timestamp modified_date = 14;

}

/**
 * Wrapper message for caching address page
 */
message TbdAddressPageProto {
  repeated TbdAddressProto content = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
  int32 number = 4; // Current page number
  int32 size = 5;   // Page size
}