plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id("com.google.protobuf") version "0.9.6"
}

group = 'com.tbd'
version = '1.0.10'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    mavenCentral()
}

ext {
    lombokVersion = '1.18.38'
    protobufVersion = '4.33.0'
}

dependencies {

    // 1. Framework Core (Internal to library)
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.9'

    // 2. Transitive Dependencies (Microservices get these automatically)
    // We use 'api' because the microservice MUST have these to run your library's code
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    api "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    api "org.springframework.boot:spring-boot-starter-data-redis:3.5.9"
    api libs.commons.math3

    // 3. Optional/Provided Dependencies (Microservice must provide these IF they use certain features)
    compileOnly "org.springframework.boot:spring-boot-starter-data-jpa:3.5.9"
    compileOnly 'org.springframework.boot:spring-boot-starter-web:3.5.9'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // 4. Tools (Compile time only)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // 5. Internal Utilities
    implementation libs.guava

    // 6. Testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {

            from components.java

            // This is the "com.tbd" part
            groupId = 'com.tbd'

            // This is the "common-security" part
            artifactId = 'common-code'

            version = '1.0.10'

        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/the-best-dukkan/common-code")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
            }
        }
    }
}